# Every push to main that bumps apps/extension/manifest.json "version" uploads
# the extension to the Chrome Web Store and submits it for review, then tags
# ext-v<version>. Pushes without a bump do nothing (tag already exists).
#
# Secrets: EXTENSION_ID, PUBLISHER_ID, CWS_CLIENT_ID, CWS_CLIENT_SECRET,
# CWS_REFRESH_TOKEN. See README "Extension release".

name: extension

on:
  push:
    branches: [main]
    paths: [apps/extension/**]
  workflow_dispatch:

concurrency: extension

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - id: v
        run: |
          v=$(jq -r .version apps/extension/manifest.json)
          echo "version=$v" >> "$GITHUB_OUTPUT"
          git fetch --tags -q
          if git rev-parse -q --verify "refs/tags/ext-v$v" >/dev/null; then echo "skip=true" >> "$GITHUB_OUTPUT"; fi
      - if: steps.v.outputs.skip != 'true'
        working-directory: apps/extension
        run: zip -qr ../../extension.zip . -x package.json "node_modules/*"
      - if: steps.v.outputs.skip != 'true'
        env:
          EXTENSION_ID: ${{ secrets.EXTENSION_ID }}
          PUBLISHER_ID: ${{ secrets.PUBLISHER_ID }}
          CLIENT_ID: ${{ secrets.CWS_CLIENT_ID }}
          CLIENT_SECRET: ${{ secrets.CWS_CLIENT_SECRET }}
          REFRESH_TOKEN: ${{ secrets.CWS_REFRESH_TOKEN }}
        run: npx -y chrome-webstore-upload-cli@4.0.2 --source extension.zip
      - if: steps.v.outputs.skip != 'true'
        run: |
          git tag "ext-v${{ steps.v.outputs.version }}"
          git push origin "ext-v${{ steps.v.outputs.version }}"
