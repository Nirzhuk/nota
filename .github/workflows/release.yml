# Every push to main releases Nota — once per version.
#
# Bump "version" in apps/desktop/src-tauri/tauri.conf.json and push: CI builds a
# Windows installer and a universal macOS app, publishes GitHub Release v<version>
# with the .exe, the .dmg, the signed updater bundles and latest.json. Pushes that
# don't change the version skip the build (the tag already exists).
#
# Installed apps poll releases/latest/download/latest.json and show
# "Update to vX" in the sidebar.
#
# Setup (once):
#   - Secrets: TAURI_SIGNING_PRIVATE_KEY        = contents of ~/.tauri/nota-updater.key
#              TAURI_SIGNING_PRIVATE_KEY_PASSWORD = contents of ~/.tauri/nota-updater.password
#   - Settings -> Actions -> General -> Workflow permissions -> Read and write.
#
# macOS is signed with Developer ID and notarized, using these secrets:
#   APPLE_CERTIFICATE (base64 of the exported .p12), APPLE_CERTIFICATE_PASSWORD,
#   APPLE_SIGNING_IDENTITY, APPLE_ID, APPLE_PASSWORD (app-specific), APPLE_TEAM_ID.
#
# ponytail: Windows isn't code signed; first install needs More info -> Run anyway.
# Add a Windows certificate when that matters.

name: release

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency: release

jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
      exists: ${{ steps.v.outputs.exists }}
    steps:
      - uses: actions/checkout@v5
      - id: v
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          v=$(jq -r .version apps/desktop/src-tauri/tauri.conf.json)
          echo "version=$v" >> "$GITHUB_OUTPUT"
          if gh release view "v$v" >/dev/null 2>&1; then echo "exists=true" >> "$GITHUB_OUTPUT"; else echo "exists=false" >> "$GITHUB_OUTPUT"; fi

  release:
    needs: check
    if: needs.check.outputs.exists == 'false'
    strategy:
      # One at a time, so the jobs can't overwrite each other's latest.json entries.
      # Windows goes first: if it fails, macOS is cancelled and no release is created,
      # so a fix can retry the same version.
      max-parallel: 1
      matrix:
        include:
          - os: windows-latest
            targets: ""
            args: --bundles nsis
          - os: macos-latest
            targets: aarch64-apple-darwin,x86_64-apple-darwin
            args: --target universal-apple-darwin --bundles app,dmg
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.targets }}
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri
      - run: bun install --frozen-lockfile
      # A startup failure on Windows is silent, so prove the app stays up before publishing.
      - if: runner.os == 'Windows'
        working-directory: apps/desktop
        shell: pwsh
        run: |
          bunx tauri build --no-bundle
          $app = Start-Process src-tauri/target/release/nota.exe -PassThru
          Start-Sleep 15
          if ($app.HasExited) {
            Get-Content "$env:TEMP/nota-crash.log" -ErrorAction SilentlyContinue
            throw "Nota exited at startup"
          }
          $app.Kill()
      - uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        with:
          projectPath: apps/desktop
          tauriScript: bunx tauri
          tagName: v__VERSION__
          releaseName: Nota v__VERSION__
          releaseBody: See the commits since the last release.
          releaseDraft: false
          uploadUpdaterJson: true
          args: ${{ matrix.args }} --config src-tauri/tauri.release.conf.json
